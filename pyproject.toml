[project]
name = "multimodal-agent"
version = "0.1.0"
description = "A multimodal LLM agent that reasons over images and documentation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vicen-te" }]
dependencies = [
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
